<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cube Dash</title>
<style>
  :root{
    --bg1:#1a1a2e; --bg2:#16213e; --accent:#00d9ff; --accent2:#ff2e63;
    --ground:#0f3460; --text:#eaeaea;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; background:var(--bg1); overflow:hidden; touch-action:manipulation;}
  body{
    display:flex; align-items:center; justify-content:center;
    font-family:'Segoe UI',system-ui,sans-serif; color:var(--text);
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  #wrap{position:relative; width:100%; max-width:900px; aspect-ratio:16/9;}
  canvas{
    width:100%; height:100%; display:block; border-radius:8px;
    background:linear-gradient(180deg,var(--bg1),var(--bg2));
    box-shadow:0 0 40px rgba(0,217,255,0.15);
  }
  #hud{
    position:absolute; top:12px; left:16px; font-size:1.1rem; font-weight:600;
    text-shadow:0 2px 6px rgba(0,0,0,0.6); pointer-events:none;
  }
  #best{
    position:absolute; top:12px; right:16px; font-size:0.9rem; opacity:0.8;
    text-shadow:0 2px 6px rgba(0,0,0,0.6); pointer-events:none;
  }
  #overlay{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; text-align:center;
    background:rgba(10,10,20,0.55); backdrop-filter:blur(2px); border-radius:8px;
  }
  #overlay h1{font-size:2rem; letter-spacing:1px;}
  #overlay p{opacity:0.85; font-size:0.95rem; max-width:80%;}
  #overlay button{
    padding:10px 28px; font-size:1rem; font-weight:700; border:none; border-radius:30px;
    background:var(--accent); color:#04202a; cursor:pointer;
    box-shadow:0 4px 14px rgba(0,217,255,0.4); transition:transform .1s;
  }
  #overlay button:active{transform:scale(0.95);}
  .hidden{display:none !important;}
  #muteBtn{
    position:absolute; bottom:12px; right:16px; width:38px; height:38px;
    border-radius:50%; border:none; background:rgba(255,255,255,0.12);
    color:var(--text); font-size:1.1rem; cursor:pointer; backdrop-filter:blur(4px);
  }
  #muteBtn:active{transform:scale(0.92);}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud">0</div>
  <div id="best">Best: 0</div>
  <button id="muteBtn" aria-label="Toggle sound">🔊</button>
  <div id="overlay">
    <h1 id="ovTitle">Cube Dash</h1>
    <p id="ovMsg">Tap, click, or press Space to jump over the spikes. Survive as long as you can!</p>
    <button id="ovBtn">Play</button>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const hud = document.getElementById('hud');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovMsg = document.getElementById('ovMsg');
  const ovBtn = document.getElementById('ovBtn');
  const muteBtn = document.getElementById('muteBtn');

  // ---------- Audio engine (synthesized, no external files) ----------
  let actx = null, masterGain = null, muted = false;
  let musicTimer = null, musicStep = 0;
  const scale = [0,3,5,7,10,12,15]; // minor pentatonic-ish, root A
  function ensureAudio(){
    if(actx) return;
    actx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = actx.createGain();
    masterGain.gain.value = 0.35;
    masterGain.connect(actx.destination);
  }
  function tone(freq, dur, type, gainVal, delay, node){
    if(!actx || muted) return;
    const t0 = actx.currentTime + (delay||0);
    const osc = actx.createOscillator();
    const g = actx.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(gainVal||0.2, t0+0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t0+dur);
    osc.connect(g); g.connect(node||masterGain);
    osc.start(t0); osc.stop(t0+dur+0.02);
  }
  function noiseBurst(dur, gainVal){
    if(!actx || muted) return;
    const t0 = actx.currentTime;
    const bufferSize = actx.sampleRate * dur;
    const buffer = actx.createBuffer(1, bufferSize, actx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++) data[i] = (Math.random()*2-1) * (1 - i/bufferSize);
    const src = actx.createBufferSource();
    src.buffer = buffer;
    const g = actx.createGain();
    g.gain.setValueAtTime(gainVal||0.3, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0+dur);
    const filt = actx.createBiquadFilter();
    filt.type = 'lowpass'; filt.frequency.value = 1200;
    src.connect(filt); filt.connect(g); g.connect(masterGain);
    src.start(t0);
  }
  function sfxJump(){ ensureAudio(); tone(520, 0.14, 'square', 0.18); tone(780, 0.1, 'square', 0.1, 0.03); }
  function sfxCrash(){ ensureAudio(); noiseBurst(0.35, 0.4); tone(90, 0.4, 'sawtooth', 0.25); }
  function sfxTick(){ ensureAudio(); tone(1046, 0.08, 'triangle', 0.12); }

  function startMusic(){
    ensureAudio();
    stopMusic();
    musicStep = 0;
    const bpm = 150;
    const stepDur = 60/bpm/2;
    musicTimer = setInterval(() => {
      if(muted){ musicStep++; return; }
      const root = 220;
      const note = scale[musicStep % scale.length];
      const octave = (Math.floor(musicStep/scale.length) % 2)===0 ? 1 : 2;
      const freq = root * Math.pow(2, note/12) * octave/2;
      tone(freq, stepDur*1.6, 'square', 0.06);
      if(musicStep % 4 === 0) tone(freq/2, stepDur*3, 'triangle', 0.08);
      musicStep++;
    }, stepDur*1000);
  }
  function stopMusic(){
    if(musicTimer){ clearInterval(musicTimer); musicTimer = null; }
  }
  muteBtn.addEventListener('click', () => {
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
    if(masterGain) masterGain.gain.value = muted ? 0 : 0.35;
  });
  // ---------------------------------------------------------------

  let W, H, DPR;
  function resize(){
    DPR = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    W = rect.width; H = rect.height;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);

  const GROUND_H_RATIO = 0.18;
  const GRAVITY = 2200;
  const JUMP_V = -820;
  let groundY;

  let best = 0;
  try { best = parseInt(localStorage.getItem('cubeDashBest') || '0', 10) || 0; } catch(e){}
  bestEl.textContent = 'Best: ' + best;

  let state = 'ready'; // ready | playing | dead
  let player, obstacles, particles, speed, score, elapsed, spawnTimer, rotSpeed;

  function reset(){
    groundY = H * (1 - GROUND_H_RATIO);
    const size = Math.max(26, H * 0.09);
    player = {
      x: W * 0.18, y: groundY - size, size,
      vy: 0, onGround: true, rot: 0
    };
    obstacles = [];
    particles = [];
    speed = W * 0.42;
    score = 0;
    elapsed = 0;
    spawnTimer = 0;
    rotSpeed = 0;
  }

  function spawnObstacle(){
    const size = Math.max(24, H * 0.09) * (0.85 + Math.random()*0.4);
    const type = Math.random() < 0.75 ? 'spike' : 'block';
    obstacles.push({ x: W + size, size, type, passed:false });
  }

  function jump(){
    if(state === 'ready'){ startGame(); return; }
    if(state !== 'playing') return;
    if(player.onGround){
      player.vy = JUMP_V;
      player.onGround = false;
      rotSpeed = 9;
      sfxJump();
    }
  }

  function startGame(){
    ensureAudio();
    reset();
    state = 'playing';
    overlay.classList.add('hidden');
    startMusic();
  }

  let shake = 0;
  function die(){
    state = 'dead';
    stopMusic();
    sfxCrash();
    shake = 18;
    for(let i=0;i<24;i++){
      particles.push({
        x: player.x + player.size/2, y: player.y + player.size/2,
        vx: (Math.random()-0.5)*600, vy: (Math.random()-0.5)*600,
        life: 0.6 + Math.random()*0.4, size: 3+Math.random()*4
      });
    }
    if(score > best){
      best = score;
      try { localStorage.setItem('cubeDashBest', String(best)); } catch(e){}
    }
    bestEl.textContent = 'Best: ' + best;
    ovTitle.textContent = 'You crashed!';
    ovMsg.textContent = 'Score: ' + score + '   Best: ' + best;
    ovBtn.textContent = 'Retry';
    setTimeout(() => overlay.classList.remove('hidden'), 350);
  }

  function rectsOverlap(ax,ay,aw,ah,bx,by,bw,bh){
    return ax < bx+bw && ax+aw > bx && ay < by+bh && ay+ah > by;
  }

  let lastT = performance.now();
  function loop(t){
    const dt = Math.min(0.033, (t - lastT)/1000);
    lastT = t;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  function update(dt){
    if(state === 'playing'){
      elapsed += dt;
      speed = W*0.42 + Math.min(W*0.85, elapsed * W*0.02);
      const prevScore = score;
      score = Math.floor(elapsed * 12);
      if(Math.floor(score/10) > Math.floor(prevScore/10)) sfxTick();
      hud.textContent = score;

      player.vy += GRAVITY * dt;
      player.y += player.vy * dt;
      const floorY = groundY - player.size;
      if(player.y >= floorY){
        player.y = floorY;
        player.vy = 0;
        if(!player.onGround){ player.onGround = true; player.rot = Math.round(player.rot/90)*90; }
      } else {
        player.onGround = false;
      }
      if(!player.onGround){ player.rot += rotSpeed * dt * 60; }

      spawnTimer -= dt;
      if(spawnTimer <= 0){
        spawnObstacle();
        const difficulty = Math.min(1, elapsed / 45); // ramps to max difficulty over 45s
        const minGap = 0.85 - difficulty*0.55;   // 0.85s -> 0.30s
        const maxGap = 1.7 - difficulty*1.0;     // 1.7s -> 0.7s
        spawnTimer = minGap + Math.random()*(maxGap-minGap);
        // occasionally spawn a tight double-obstacle once things get fast
        if(difficulty > 0.35 && Math.random() < 0.25 + difficulty*0.25){
          spawnTimer = 0.22 - difficulty*0.08; // short fixed gap for a paired obstacle
        }
      }

      for(const o of obstacles){ o.x -= speed*dt; }
      obstacles = obstacles.filter(o => o.x > -o.size*2);

      const px = player.x, py = player.y, ps = player.size;
      const hb = ps*0.78, off=(ps-hb)/2;
      for(const o of obstacles){
        if(o.type === 'block'){
          if(rectsOverlap(px+off,py+off,hb,hb,o.x,groundY-o.size,o.size,o.size)){ die(); return; }
        } else {
          const cx = o.x + o.size/2, cy = groundY - o.size*0.15;
          const dx = Math.max(px+off, Math.min(cx, px+off+hb)) - cx;
          const dy = Math.max(py+off, Math.min(cy, py+off+hb)) - cy;
          if(dx*dx+dy*dy < (o.size*0.32)*(o.size*0.32)){ die(); return; }
        }
      }
    }

    for(const p of particles){
      p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 900*dt; p.life -= dt;
    }
    particles = particles.filter(p => p.life > 0);
    if(shake > 0) shake = Math.max(0, shake - dt*40);
  }

  function draw(){
    ctx.save();
    if(shake > 0){
      ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
    }
    ctx.clearRect(-20,-20,W+40,H+40);

    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#1a1a2e'); g.addColorStop(1,'#16213e');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#ff2e63';
    for(let i=0;i<12;i++){
      const px = ((i*137 - elapsed*speed*0.15) % (W+100)) - 50;
      const py = (i*53) % (groundY*0.7) + 10;
      ctx.beginPath();
      ctx.arc(((px%(W+100))+W+100)%(W+100), py, 2+((i*31)%3), 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = 0.15;
    ctx.strokeStyle = '#00d9ff';
    const gridOffset = (elapsed*speed*0.001*60)%40;
    for(let x=-40+((-gridOffset)%40); x<W; x+=40){
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,groundY); ctx.stroke();
    }
    ctx.restore();

    ctx.fillStyle = '#0f3460';
    ctx.fillRect(0, groundY, W, H-groundY);
    ctx.fillStyle = '#00d9ff';
    ctx.fillRect(0, groundY, W, 3);

    for(const o of obstacles){
      if(o.type === 'block'){
        ctx.fillStyle = '#ff2e63';
        ctx.fillRect(o.x, groundY-o.size, o.size, o.size);
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.strokeRect(o.x, groundY-o.size, o.size, o.size);
      } else {
        ctx.fillStyle = '#ff2e63';
        ctx.beginPath();
        ctx.moveTo(o.x, groundY);
        ctx.lineTo(o.x+o.size/2, groundY-o.size);
        ctx.lineTo(o.x+o.size, groundY);
        ctx.closePath();
        ctx.fill();
      }
    }

    for(const p of particles){
      ctx.globalAlpha = Math.max(0,p.life);
      ctx.fillStyle = '#00d9ff';
      ctx.fillRect(p.x, p.y, p.size, p.size);
      ctx.globalAlpha = 1;
    }

    if(state !== 'dead' || particles.length){
      ctx.save();
      ctx.translate(player.x+player.size/2, player.y+player.size/2);
      ctx.rotate(player.rot*Math.PI/180);
      const s = player.size;
      const grad = ctx.createLinearGradient(-s/2,-s/2,s/2,s/2);
      grad.addColorStop(0,'#00d9ff'); grad.addColorStop(1,'#0077ff');
      ctx.fillStyle = grad;
      ctx.fillRect(-s/2,-s/2,s,s);
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.lineWidth = 2;
      ctx.strokeRect(-s/2,-s/2,s,s);
      ctx.fillStyle = '#04202a';
      ctx.fillRect(-s*0.18,-s*0.18,s*0.14,s*0.14);
      ctx.fillRect(s*0.05,-s*0.18,s*0.14,s*0.14);
      ctx.restore();
    }
    ctx.restore();
  }

  ovBtn.addEventListener('click', () => { if(state!=='playing') startGame(); });
  window.addEventListener('keydown', e => {
    if(e.code === 'Space' || e.code === 'ArrowUp'){ e.preventDefault(); jump(); }
  });
  canvas.addEventListener('pointerdown', jump);

  function init(){
    resize();
    reset();
    draw();
    requestAnimationFrame(loop);
  }
  init();
})();
</script>
</body>
</html>
